name: Pantip threads (weekly)

# Refreshes backend/app/data/pantip_reviews.json from Pantip's public tag pages
# (titles and links only) every Monday 03:17 Bangkok time, and commits it if it changed.
on:
  schedule:
    - cron: "17 20 * * 0"   # Sunday 20:17 UTC = Monday 03:17 ICT
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Fetch
        working-directory: backend
        run: python scripts/fetch_pantip.py
      - name: Commit if changed
        run: |
          if git diff --quiet backend/app/data/pantip_reviews.json; then
            echo "no change"; exit 0
          fi
          git config user.name "car-advisor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/data/pantip_reviews.json
          git commit -m "data: weekly Pantip threads refresh"
          git push
